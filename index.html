<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 7 Science — Motion Test</title>

<style>
:root{
  --bg:#f4eee7;
  --card:#fffaf5;
  --text:#302b35;
  --muted:#756d78;
  --accent:#6d4aff;
  --accent2:#8d6cff;
  --green:#2e9d62;
  --red:#d94b4b;
  --line:#e4dbd2;
  --shadow:0 12px 35px rgba(60,45,35,.10);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(760px,94%);
  margin:auto;
  padding:24px 0 45px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:var(--shadow);
}

.hidden{
  display:none!important;
}

.center{
  text-align:center;
}

.logo{
  width:68px;
  height:68px;
  margin:0 auto 18px;
  border-radius:20px;
  background:var(--accent);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:800;
}

h1,h2,h3{
  margin-top:0;
}

h1{
  font-size:29px;
  margin-bottom:10px;
}

h2{
  font-size:24px;
  margin-bottom:10px;
}

h3{
  font-size:18px;
}

p{
  line-height:1.6;
}

.muted{
  color:var(--muted);
}

.name-input{
  width:100%;
  padding:15px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:white;
  color:var(--text);
  outline:none;
  margin:15px 0;
}

.name-input:focus,
.jump-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(109,74,255,.10);
}

.primary{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px 18px;
  background:var(--accent);
  color:white;
  font-weight:700;
  transition:.2s;
}

.primary:hover{
  background:var(--accent2);
  transform:translateY(-1px);
}

.secondary{
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 17px;
  background:white;
  color:var(--text);
  font-weight:700;
}

.secondary:hover{
  border-color:var(--accent);
}

.secondary:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.rule-list{
  display:grid;
  gap:12px;
  margin:20px 0;
}

.rule{
  padding:15px;
  border:1px solid var(--line);
  border-radius:15px;
  background:white;
}

.section-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin:20px 0;
}

.section-box{
  padding:17px;
  border:1px solid var(--line);
  border-radius:17px;
  background:white;
}

.section-box strong{
  display:block;
  margin-bottom:7px;
}

.warning{
  padding:15px;
  border-radius:15px;
  background:#fff7dc;
  border:1px solid #ead79a;
  line-height:1.55;
  margin:18px 0;
}

.question-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.badge{
  padding:8px 12px;
  border-radius:999px;
  background:#eee9ff;
  color:var(--accent);
  font-weight:700;
  font-size:13px;
}

.timer{
  padding:8px 13px;
  border-radius:999px;
  background:#f0ece7;
  font-weight:800;
  min-width:72px;
  text-align:center;
}

.timer.low{
  background:#ffe5e5;
  color:var(--red);
}

.current-progress{
  padding:13px 15px;
  background:#f8f3ee;
  border-radius:14px;
  margin-bottom:22px;
  line-height:1.9;
}

.progress-area{
  margin:8px 0 23px;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  gap:15px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:7px;
}

.progress-track{
  height:8px;
  background:#e8e1db;
  border-radius:99px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:99px;
  transition:width .25s;
}

.question{
  font-size:21px;
  font-weight:700;
  line-height:1.45;
  margin:0 0 20px;
}

.options{
  display:grid;
  gap:12px;
}

.option{
  width:100%;
  text-align:left;
  padding:15px;
  border:1px solid var(--line);
  background:white;
  border-radius:15px;
  color:var(--text);
  transition:.18s;
}

.option:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

.option.selected{
  border-color:var(--accent);
  background:#f0ecff;
}

.option.locked{
  cursor:not-allowed;
  opacity:.72;
}

.text-answer{
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:white;
  outline:none;
}

.text-answer:disabled{
  background:#f0ece7;
}

.lock-note{
  margin-top:15px;
  padding:12px 14px;
  background:#fff0f0;
  color:var(--red);
  border:1px solid #f2cccc;
  border-radius:13px;
  font-size:14px;
}

.nav-area{
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid var(--line);
}

.nav-buttons{
  display:flex;
  gap:12px;
}

.nav-buttons button{
  flex:1;
}

.jump-area{
  margin-top:19px;
  padding:16px;
  border-radius:16px;
  background:#f8f3ee;
}

.jump-trigger{
  width:100%;
  border:0;
  background:transparent;
  color:var(--accent);
  font-weight:700;
  padding:4px;
}

.jump-form{
  display:flex;
  gap:10px;
  margin-top:13px;
}

.jump-input{
  min-width:0;
  flex:1;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
}

.jump-error{
  color:var(--red);
  font-size:13px;
  margin-top:9px;
}

.journey{
  text-align:center;
  padding:38px 12px;
}

.journey-line{
  margin:20px 0;
  font-size:18px;
  font-weight:700;
  color:var(--accent);
  word-break:break-word;
  line-height:1.8;
}

.fade{
  animation:fade .35s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.score-grid{
  display:grid;
  gap:12px;
  margin:22px 0;
}

.score-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px;
  border:1px solid var(--line);
  background:white;
  border-radius:15px;
}

.total-score{
  padding:20px;
  border-radius:18px;
  background:#eee9ff;
  text-align:center;
  margin:18px 0;
}

.total-score .big{
  font-size:35px;
  font-weight:800;
  color:var(--accent);
}

.review-grid{
  display:grid;
  gap:12px;
  margin-top:20px;
}

.review-card{
  padding:17px;
  border:1px solid var(--line);
  border-radius:17px;
  background:white;
}

.review-card.correct{
  border-left:5px solid var(--green);
}

.review-card.wrong{
  border-left:5px solid var(--red);
}

.review-q{
  font-weight:700;
  line-height:1.5;
  margin-bottom:13px;
}

.answer-line{
  margin:7px 0;
  line-height:1.5;
}

.correct-text{
  color:var(--green);
  font-weight:700;
}

.wrong-text{
  color:var(--red);
  font-weight:700;
}

.explanation{
  margin-top:12px;
  padding:12px;
  background:#f8f3ee;
  border-radius:12px;
  font-size:14px;
  line-height:1.55;
}

.choice-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:22px;
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:20px;
}

@media(max-width:560px){
  .app{
    width:94%;
    padding-top:14px;
    padding-bottom:35px;
  }

  .card{
    padding:20px 17px;
    border-radius:20px;
  }

  h1{font-size:25px}
  h2{font-size:21px}

  .section-grid{
    grid-template-columns:1fr;
  }

  .question{
    font-size:19px;
  }

  .nav-buttons{
    flex-direction:column;
  }

  .jump-form{
    flex-direction:column;
  }

  .choice-row{
    grid-template-columns:1fr;
  }

  .question-top{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="app">
  <div id="screen" class="card fade"></div>

</div>

/* =========================================================
   FIXED NORMAL TIMER
   =========================================================

   IMPORTANT:
   remaining is NOT decreased every 100ms.
   We calculate elapsed time from startedAt.
   remaining is updated only when the question is left
   or when the timer reaches zero.
   ========================================================= */

function startNormalTimer(){

  clearNormalTimer();

  const sec=state.sec;
  const index=state.idx;

  if(state.locked[sec][index]){
    return;
  }

  if(state.remaining[sec][index]<=0){
    state.remaining[sec][index]=0;
    state.locked[sec][index]=true;
    renderQuestion(false);
    return;
  }

  state.startedAt=Date.now();

  state.timer=setInterval(()=>{

    const elapsed=
      (Date.now()-state.startedAt)/1000;

    const left=Math.max(
      0,
      state.remaining[sec][index]-elapsed
    );

    const timer=document.getElementById("timer");

    if(timer){

      timer.textContent=formatTime(left);

      if(left<=10){
        timer.classList.add("low");
      }

    }

    if(left<=0){

      state.remaining[sec][index]=0;
      state.locked[sec][index]=true;

      clearNormalTimer();

      renderQuestion(false);
    }

  },100);
}


function saveNormalTime(){

  if(state.startedAt===null){
    return;
  }

  const sec=state.sec;
  const index=state.idx;

  const elapsed=
    (Date.now()-state.startedAt)/1000;

  state.remaining[sec][index]=Math.max(
    0,
    state.remaining[sec][index]-elapsed
  );

  state.startedAt=null;
}


function clearNormalTimer(){

  if(state.timer!==null){

    clearInterval(state.timer);

    state.timer=null;
  }

  state.startedAt=null;
}


/* =========================================================
   NORMAL ANSWERS
   ========================================================= */

function chooseOption(value){

  const sec=state.sec;
  const index=state.idx;

  if(state.locked[sec][index]){
    return;
  }

  state.answers[sec][index]=value;

  document.querySelectorAll(".option").forEach((el,i)=>{
    el.classList.toggle(
      "selected",
      i===value
    );
  });
}


function saveTextAnswer(value){

  const sec=state.sec;
  const index=state.idx;

  if(state.locked[sec][index]){
    return;
  }

  state.answers[sec][index]=value;
}


/* =========================================================
   NORMAL NAVIGATION
   ========================================================= */

function previousQuestion(){

  saveNormalTime();
  clearNormalTimer();

  if(state.idx>0){

    state.idx--;

    renderQuestion(true);
  }
}


function nextQuestion(){

  saveNormalTime();
  clearNormalTimer();

  const total=sectionTotal(state.sec);

  if(state.idx<total-1){

    state.idx++;

    /*
      Only normal sequential movement changes actual progress.
      Direct jumps never change furthest.
    */

    state.furthest[state.sec]=Math.max(
      state.furthest[state.sec],
      state.idx+1
    );

    renderQuestion(true);

  }else{

    submitSection();
  }
}


/* =========================================================
   DIRECT QUESTION JUMP
   ========================================================= */

function openJump(){

  /*
    The moment the user chooses to go to another question,
    the current question timer is saved and paused.
  */

  saveNormalTime();
  clearNormalTimer();

  const form=document.getElementById("jumpForm");

  if(form){
    form.classList.remove("hidden");

    setTimeout(()=>{
      document.getElementById("jumpInput")?.focus();
    },50);
  }
}


function jumpToQuestion(){

  const input=document.getElementById("jumpInput");
  const error=document.getElementById("jumpError");

  const target=Number(input.value);
  const total=sectionTotal(state.sec);

  if(
    !Number.isInteger(target) ||
    target<1 ||
    target>total
  ){

    error.textContent=
      `Please enter a question number from 1 to ${total}.`;

    return;
  }

  const from=state.idx+1;

  if(target===from){

    renderQuestion(true);
    return;
  }

  showJourney(from,target);
}


function showJourney(from,to){

  const direction=to>from?1:-1;
  const path=[];

  for(
    let n=from;
    n!==to+direction;
    n+=direction
  ){

    path.push(n);
  }

  setScreen(`
    <div class="journey">

      <div class="logo">→</div>

      <h2>Moving to Question ${to}</h2>

      <p class="muted">
        Your current question timer has been saved.
      </p>

      <div
        id="journeyLine"
        class="journey-line"
      ></div>

    </div>
  `);

  let position=0;

  function animate(){

    if(position>=path.length){

      state.idx=to-1;

      renderQuestion(true);

      return;
    }

    const line=document.getElementById("journeyLine");

    if(line){

      line.textContent=
        path.slice(0,position+1).join(" → ");
    }

    position++;

    setTimeout(animate,110);
  }

  animate();
}

/* =========================================================
   FIXED GLOBAL REVISION TIMER
   ========================================================= */

function startRevisionTimer(){

  clearRevisionTimer();

  if(state.revision.remaining<=0){

    finalizeTest();

    return;
  }

  state.revision.startedAt=Date.now();

  state.revision.timer=setInterval(()=>{

    const elapsed=
      (Date.now()-state.revision.startedAt)/1000;

    const left=Math.max(
      0,
      state.revision.remaining-elapsed
    );

    const timer=document.getElementById("revTimer");

    if(timer){

      timer.textContent=
        formatRevisionTimeFrom(left);

      if(left<=15){
        timer.classList.add("low");
      }
    }

    if(left<=0){

      state.revision.remaining=0;

      clearRevisionTimer();

      finalizeTest();
    }

  },100);
}


function saveRevisionTime(){

  if(state.revision.startedAt===null){
    return;
  }

  const elapsed=
    (Date.now()-state.revision.startedAt)/1000;

  state.revision.remaining=Math.max(
    0,
    state.revision.remaining-elapsed
  );

  state.revision.startedAt=null;
}


function clearRevisionTimer(){

  if(state.revision.timer!==null){

    clearInterval(state.revision.timer);

    state.revision.timer=null;
  }

  state.revision.startedAt=null;
}


function formatRevisionTime(){

  return formatRevisionTimeFrom(
    state.revision.remaining
  );
}


function formatRevisionTimeFrom(seconds){

  const totalSeconds=Math.max(
    0,
    Math.ceil(seconds)
  );

  const minutes=Math.floor(
    totalSeconds/60
  );

  const secondsPart=totalSeconds%60;

  return `${String(minutes).padStart(2,"0")}:${String(secondsPart).padStart(2,"0")}`;
}

function proceedRevision(){

  const current=state.revision.sec;

  const next=nextSection(current);

  if(!next){

    finishRevision();

    return;
  }

  state.revision.sec=next;
  state.revision.idx=0;

  /*
    Timer remains paused on this opening page.
  */

  showRevisionSectionIntro(next);
}


function finishRevision(){

  clearRevisionTimer();

  finalizeTest();
}


/* =========================================================
   TEXT ANSWER CHECKING
   ========================================================= */

function normalizeText(value){

  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");
}


function levenshtein(a,b){

  const m=a.length;
  const n=b.length;

  const dp=
    Array.from(
      {length:m+1},
      ()=>Array(n+1).fill(0)
    );

  for(let i=0;i<=m;i++){
    dp[i][0]=i;
  }

  for(let j=0;j<=n;j++){
    dp[0][j]=j;
  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      const cost=
        a[i-1]===b[j-1]
          ?0
          :1;

      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+cost
      );
    }
  }

  return dp[m][n];
}


/*
  Spelling rule:

  1. Exact match → correct
  2. One missing final character → accepted
  3. One-character typing mistake → accepted
  4. Broad fuzzy matching → NOT accepted
*/

function textAnswerResult(user,question){

  const input=normalizeText(user);

  if(!input){

    return {
      correct:false,
      acceptedTypo:false,
      canonical:question.answer
    };
  }

  const answers=
    question.answers.map(normalizeText);

  for(const canonical of answers){

    if(input===canonical){

      return {
        correct:true,
        acceptedTypo:false,
        canonical
      };
    }


    if(
      input.length===canonical.length-1 &&
      canonical.startsWith(input)
    ){

      return {
        correct:true,
        acceptedTypo:true,
        canonical
      };
    }


    if(
      input.length===canonical.length &&
      levenshtein(input,canonical)===1
    ){

      return {
        correct:true,
        acceptedTypo:true,
        canonical
      };
    }
  }

  return {
    correct:false,
    acceptedTypo:false,
    canonical:answers[0]
  };
}


/* =========================================================
   SCORE
   ========================================================= */

function calculateScores(){

  const scores={
    mcq:0,
    assert:0,
    one:0,
    fill:0
  };


  for(const sec of ["mcq","assert"]){

    QUESTIONS[sec].forEach((q,i)=>{

      if(state.answers[sec][i]===q.answer){
        scores[sec]++;
      }

    });
  }


  for(const sec of ["one","fill"]){

    QUESTIONS[sec].forEach((q,i)=>{

      const result=
        textAnswerResult(
          state.answers[sec][i],
          q
        );

      if(result.correct){
        scores[sec]++;
      }

    });
  }


  scores.total=
    scores.mcq+
    scores.assert+
    scores.one+
    scores.fill;


  scores.max=
    sectionTotal("mcq")+
    sectionTotal("assert")+
    sectionTotal("one")+
    sectionTotal("fill");


  scores.percentage=
    scores.max===0
      ?0
      :(scores.total/scores.max)*100;


  return scores;
}


/* =========================================================
   FINALIZATION
   ========================================================= */

function finalizeTest(){

  clearNormalTimer();
  clearRevisionTimer();

  state.scores=calculateScores();

  showFinalization();
}


function showFinalization(){

  setScreen(`

    <div class="center">

      <div class="logo">✓</div>

      <h2>Your test has been finalized.</h2>

      <p class="muted">
        Check your score
      </p>

      <button
        class="primary"
        onclick="showScorePage()"
      >
        Check Your Score
      </button>

    </div>

  `);
}


/* =========================================================
   SCORE PAGE
   ========================================================= */

function showScorePage(){

  if(!state.scores){
    state.scores=calculateScores();
  }

  const s=state.scores;

  setScreen(`

    <div class="center">

      <div class="logo">★</div>

      <h2>Final Score</h2>

      <p class="muted">
        Well done, ${esc(state.name)}!
      </p>

    </div>


    <div class="score-grid">

      ${scoreRow(
        "MCQ",
        s.mcq,
        sectionTotal("mcq")
      )}

      ${scoreRow(
        "Assertion & Reasoning",
        s.assert,
        sectionTotal("assert")
      )}

      ${scoreRow(
        "One Word",
        s.one,
        sectionTotal("one")
      )}

      ${scoreRow(
        "Fill in the Blanks",
        s.fill,
        sectionTotal("fill")
      )}

    </div>


    <div class="total-score">

      <div class="big">
        ${s.total} / ${s.max}
      </div>

      <div>
        <strong>
          ${s.percentage.toFixed(2)}%
        </strong>
      </div>

    </div>


    <h3>Check Answers</h3>

    <div class="review-grid">

      ${SECTION_ORDER.map(sec=>`

        <button
          class="secondary"
          onclick="confirmAnswerReview('${sec}')"
        >
          Check ${sectionTitle(sec)} Answers
        </button>

      `).join("")}

    </div>


    <div style="margin-top:22px">

      <button
        class="primary"
        onclick="restartTest()"
      >
        Restart Test
      </button>

    </div>

  `);
}


function scoreRow(name,score,max){

  return `
    <div class="score-row">

      <span>${name}</span>

      <strong>
        ${score} / ${max}
      </strong>

    </div>
  `;
}


/* =========================================================
   ANSWER REVIEW CONFIRMATION
   ========================================================= */

function confirmAnswerReview(sec){

  setScreen(`

    <div class="center">

      <div class="logo">?</div>

      <h2>
        Check ${sectionTitle(sec)}?
      </h2>

      <p class="muted">
        Since you have selected ${sectionTitle(sec)},
        do you want to check the answers?
      </p>

      <div class="choice-row">

        <button
          class="primary"
          onclick="showAnswerSheet('${sec}')"
        >
          Yes
        </button>

        <button
          class="secondary"
          onclick="showScorePage()"
        >
          No
        </button>

      </div>

    </div>

  `);
}


/* =========================================================
   ANSWER SHEET
   ========================================================= */

function showAnswerSheet(sec){

  const list=QUESTIONS[sec];

  const cards=list.map((q,i)=>{

    const user=state.answers[sec][i];

    let correct=false;
    let acceptedTypo=false;
    let canonical="";

    if(sec==="mcq" || sec==="assert"){

      correct=user===q.answer;

      canonical=q.options[q.answer];

    }else{

      const result=
        textAnswerResult(user,q);

      correct=result.correct;
      acceptedTypo=result.acceptedTypo;
      canonical=q.answer;
    }


    let userDisplay="";

    if(sec==="mcq" || sec==="assert"){

      userDisplay=
        user===null
          ?"Not answered"
          :esc(q.options[user]);

    }else{

      userDisplay=
        String(user || "").trim()
          ?esc(user)
          :"Not answered";
    }


    return `

      <div
        class="review-card
        ${correct?"correct":"wrong"}"
      >

        <div class="review-q">
          Q${i+1}. ${q.q}
        </div>


        <div class="answer-line">
          <strong>Your answer:</strong>
          ${userDisplay}
        </div>


        <div class="answer-line">
          <strong>Correct answer:</strong>
          ${esc(canonical)}
        </div>


        ${
          correct
          ?
          `<div class="correct-text">
            ✓ Correct
          </div>`
          :
          `<div class="wrong-text">
            ✗ Your answer is incorrect.
          </div>`
        }


        ${
          acceptedTypo
          ?
          `
            <div class="explanation">

              <strong>
                Did you mean “${esc(canonical)}”?
              </strong><br>

              Your answer was accepted as correct.<br>

              Please pay attention to spelling next time.

            </div>
          `
          :""
        }


        <div class="explanation">

          <strong>Explanation:</strong><br>

          ${q.explanation}

        </div>

      </div>
    `;

  }).join("");


  setScreen(`

    <h2>
      ${sectionTitle(sec)} — Answer Sheet
    </h2>

    <p class="muted">
      These are your final saved answers.
      Any changes made during revision are reflected here.
    </p>

    <div class="review-grid">
      ${cards}
    </div>

    <div style="margin-top:24px">

      <button
        class="primary"
        onclick="showScorePage()"
      >
        Back to Score
      </button>

    </div>

  `);
}


/* =========================================================
   RESTART
   ========================================================= */

function restartTest(){

  // Stop any running timers.
  clearNormalTimer();
  clearRevisionTimer();

  // Reset name and question navigation.
  state.name="";
  state.sec="mcq";
  state.idx=0;

  // Reset all saved answers.
  state.answers={
    mcq:Array(QUESTIONS.mcq.length).fill(null),
    assert:Array(QUESTIONS.assert.length).fill(null),
    one:Array(QUESTIONS.one.length).fill(""),
    fill:Array(QUESTIONS.fill.length).fill("")
  };

  // Reset the time available for every question.
  state.remaining={
    mcq:Array(QUESTIONS.mcq.length).fill(SECTION_INFO.mcq.time),
    assert:Array(QUESTIONS.assert.length).fill(SECTION_INFO.assert.time),
    one:Array(QUESTIONS.one.length).fill(SECTION_INFO.one.time),
    fill:Array(QUESTIONS.fill.length).fill(SECTION_INFO.fill.time)
  };

  // Unlock every question.
  state.locked={
    mcq:Array(QUESTIONS.mcq.length).fill(false),
    assert:Array(QUESTIONS.assert.length).fill(false),
    one:Array(QUESTIONS.one.length).fill(false),
    fill:Array(QUESTIONS.fill.length).fill(false)
  };

  // Reset actual test progress.
  state.furthest={
    mcq:0,
    assert:0,
    one:0,
    fill:0
  };

  // Reset normal timer state.
  state.timer=null;
  state.startedAt=null;

  // Allow revision to be used again.
  state.revisionUsed=false;

  // Reset the revision section and its global two-minute timer.
  state.revision={
    sec:"mcq",
    idx:0,
    remaining:120,
    timer:null,
    startedAt:null
  };

  // Clear the previous score.
  state.scores=null;

  // Return to the name-entry screen.
  showNamePage();
}


/* =========================================================
   START
   ========================================================= */

showNamePage();

</script>
